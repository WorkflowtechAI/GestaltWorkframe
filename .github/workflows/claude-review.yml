# AUTO-SYNCED from the LLM Builder Kit. Do not edit here; edit the kit source and re-run sync-standards.ps1.

# Claude code review. Claude Code reviews every PR with the whole repo in view
# and posts one review comment; the check fails only on a blocking finding or
# when no review could run.
#
# A repo gets this file two ways: operator-tools/Bootstrap-Repo.ps1 at onboarding,
# or by naming claude-review in docs/standards/.standards-include, which puts it
# on the same drift check as every other vendored standard.
#
# TWO WAYS TO PAY, TRIED IN ORDER.
#   1. CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`): runs on the operator's
#      Claude subscription and draws on its usage. Model: vars.CLAUDE_REVIEW_MODEL,
#      default `sonnet`.
#   2. ANTHROPIC_API_KEY: runs only when (1) is missing or did not finish, which
#      is what happens when the subscription is out of usage. Billed to the key.
#      Model: vars.CLAUDE_REVIEW_FALLBACK_MODEL when set. Otherwise a repo that
#      routes through the kit's LiteLLM broker (vars.ANTHROPIC_BASE_URL set) gets
#      `openrouter/anthropic/claude-haiku-4.5`, which the broker sends to
#      OpenRouter first and to Anthropic second; a repo calling Anthropic directly
#      gets `claude-haiku-4-5`.
#      KNOWN LIMIT, measured 2026-11-14: Anthropic answers any request carrying
#      Claude Code's `claude-code-20250219` beta or `claude-cli` user agent with
#      HTTP 400 "credit balance is too low" on the operator's API keys, while plain
#      calls on the same key succeed and the org has credit. So this route works
#      only through the broker's OpenRouter alias; a repo calling Anthropic
#      directly has no working fallback while that holds.
# When neither can run, the check goes red and quotes the API's answer: the review
# is dark until the subscription has usage again. Both are repo
# secrets set by operator-tools/Sync-Secrets.ps1. Fork PRs get no secrets and are
# not reviewed; Dependabot PRs get no Actions secrets and are skipped.
#
# The model only reads: the repo, the diff, the PR. It returns a structured
# verdict (the contract in docs/standards/review-standards.md) and the comment
# text, and the deterministic step at the end posts the comment and decides the
# check. The model never writes to the PR or the repo.
#
# Third-party actions are SHA-pinned: the tag comment is for humans, the SHA is
# what runs. To bump one, resolve the new tag to its COMMIT (an annotated tag's
# `git/ref/tags/<tag>` is the tag object; follow it with `git/tags/<sha>`), then
# update the SHA and the comment together.
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Not "claude-review-<n>": the retired pull_request_target workflow used that
  # group, and while both existed on kit #359 the old one cancelled this one.
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    # Hosted for a PUBLIC repo, the egi-vps pool for everything else: the org
    # runner group excludes public repositories, and opening the pool to them
    # would let fork PRs run code on the VPS. A missing or unknown visibility
    # falls to the pool.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    # Same-repo PRs only (fork PRs never see a secret), no drafts (a draft cannot
    # merge; `ready_for_review` reviews it when it can), no Dependabot (no
    # Actions secrets reach its PRs).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft != true &&
      github.actor != 'dependabot[bot]'
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      SUB_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'sonnet' }}
      API_MODEL: ${{ vars.CLAUDE_REVIEW_FALLBACK_MODEL || (vars.ANTHROPIC_BASE_URL != '' && 'openrouter/anthropic/claude-haiku-4.5') || 'claude-haiku-4-5' }}
      # One prompt and one tool list for both routes.
      REVIEW_PROMPT: |
          You are reviewing pull request #${{ github.event.pull_request.number }} in
          ${{ github.repository }}. The checkout is the PR merged into its base; HEAD^1 is
          the base. You can read the repo and the PR, and nothing else: change no file and
          post nothing. Your structured output is the whole result.

          Standards, in order: REVIEW.md at the repo root if it exists, then
          docs/standards/review-standards.md, then docs/standards/coding-rules.md. Where a
          standard is missing, use the general shape: correctness, security, tests,
          maintainability.

          Procedure:
          1. List the changed files with `gh pr view ${{ github.event.pull_request.number }} --json files`
             and read the PR body with `gh pr view ${{ github.event.pull_request.number }}`.
          2. For each changed file that still exists, read it in full and read its diff with
             `git diff HEAD^1 HEAD -- <path>`. Read callers and siblings where the change
             could break them.
          3. A file the PR deletes: do not review its old contents. Check only whether
             anything that remains still refers to it (`git grep` for its path or names).
          4. Lockfiles: do not review them; say that their resolved pins need a human or a
             dependency tool.
          5. Check every completion claim in the PR body against evidence in the diff.

          A finding is BLOCKING only if it is a correctness bug, a security hole, a broken
          build or test, data loss, or a claim in the PR body that the diff contradicts. Scope,
          style, naming and documentation polish are findings, never blocking.

          Return:
          - verdict: "autoMerge" when nothing is blocking and no escalation surface from
            review-standards.md is touched; otherwise "needs-operator".
          - summary: one line.
          - blocking: one entry per blocking finding, each starting with file:line. Empty
            when there are none.
          - comment_markdown: the review comment, in markdown: what you checked, then
            findings with file:line, blocking ones first. Plain declarative sentences.
      REVIEW_ARGS: >-
        --max-turns 60
        --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"
        --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
        --json-schema '{"type":"object","additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["autoMerge","needs-operator"]},"summary":{"type":"string"},"blocking":{"type":"array","items":{"type":"string"}},"comment_markdown":{"type":"string"}},"required":["verdict","summary","blocking","comment_markdown"]}'
    steps:
      - name: Check out the PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit, with history, so HEAD^1 is the base it merges into.
          fetch-depth: 0
          persist-credentials: false

      # The action installs Bun with oven-sh/setup-bun, which needs `unzip`. The
      # self-hosted pool has none, and no sudo to add it (measured on kit #359:
      # "Unable to locate executable file: unzip"). So the Bun the action pins,
      # 1.4.4, is fetched here, checked against its published SHA-256, unpacked
      # with Python's zipfile, and handed to the action. Bump the version, URL and
      # sum together when the action's pin moves.
      - name: Install Bun for the action
        if: env.HAS_OAUTH == 'true' || env.HAS_API_KEY == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bun-1.4.4"
          zip="$dir/bun-linux-x64.zip"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$zip" https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          echo "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  $zip" | sha256sum -c -
          python3 -m zipfile -e "$zip" "$dir"
          chmod +x "$dir/bun-linux-x64/bun"
          "$dir/bun-linux-x64/bun" --version
          echo "BUN_PATH=$dir/bun-linux-x64/bun" >> "$GITHUB_ENV"

      - name: Review on the subscription
        id: review
        if: env.HAS_OAUTH == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        # The action writes `git config --global safe.bareRepository explicit`. The
        # pool's runners share one user and one ~/.gitconfig, so that setting broke
        # a concurrent job's bare-repo test on kit #359. Its global config goes to
        # a per-job file instead.
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/claude-review.gitconfig
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }} --model ${{ env.SUB_MODEL }}

      # THE KEY TRAVELS WITH THIS URL. vars.ANTHROPIC_BASE_URL is a repository
      # variable, a lower bar than a secret, and the fallback sends
      # ANTHROPIC_API_KEY to it. Same rule as harness-enforcer.yml: https://, or
      # loopback by parsed hostname (never a prefix: 127.0.0.1.evil.test is not
      # loopback). A refusal skips the fallback and the comment says why.
      - name: Check the fallback's base URL
        if: >-
          (steps.review.outcome != 'success' || steps.review.outputs.structured_output == '') &&
          env.HAS_API_KEY == 'true'
        env:
          BASE: ${{ vars.ANTHROPIC_BASE_URL }}
        run: |
          python3 - <<'URLEOF'
          import os, urllib.parse
          base = os.environ.get("BASE", "").strip()
          try:
              host = urllib.parse.urlsplit(base).hostname if base else None
          except ValueError:
              host = None
          if base and not base.startswith("https://") and host not in ("127.0.0.1", "localhost", "::1"):
              # repr() keeps a newline in the variable from writing a second env line.
              msg = f"ANTHROPIC_BASE_URL must be https:// or loopback, because the API key is sent with it (got {base!r})"
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write(f"FALLBACK_REFUSED={msg}\n")
              print(f"::error::{msg}")
          URLEOF

      - name: Review on the API key (subscription unavailable)
        id: fallback
        if: >-
          (steps.review.outcome != 'success' || steps.review.outputs.structured_output == '') &&
          env.HAS_API_KEY == 'true' && env.FALLBACK_REFUSED == ''
        continue-on-error: true
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/claude-review.gitconfig
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }} --model ${{ env.API_MODEL }}

      # Deterministic: post the comment, then pass or fail. A review that could not
      # run is a red check that names which route failed, never a quiet green.
      - name: Post the review and decide the check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SUB_RESULT: ${{ steps.review.outputs.structured_output }}
          API_RESULT: ${{ steps.fallback.outputs.structured_output }}
          SUB_OUTCOME: ${{ steps.review.outcome }}
          API_OUTCOME: ${{ steps.fallback.outcome }}
          SUB_EXEC: ${{ steps.review.outputs.execution_file }}
          API_EXEC: ${{ steps.fallback.outputs.execution_file }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys

          # Key-shaped strings, scrubbed from everything this step prints or posts.
          # The model reads the whole checkout, so a secret someone committed could
          # otherwise be quoted into a PR comment. TruffleHog is the real control
          # for committed secrets; this is the second layer on the way out.
          # Specific prefixes only: a generic "key-..." pattern rewrote ordinary
          # words ("key-shaped") in a real review on kit #359.
          KEY_SHAPES = re.compile(
              r"\bsk-[A-Za-z0-9_\-]{16,}"
              r"|\bgh[pousr]_[A-Za-z0-9]{20,}"
              r"|\bgithub_pat_[A-Za-z0-9_]{20,}"
              r"|\bAKIA[0-9A-Z]{16}\b"
              r"|\bxox[abprs]-[A-Za-z0-9-]{10,}"
          )

          def scrub(text):
              return KEY_SHAPES.sub(lambda m: m.group(0)[:4] + "<redacted>", text)

          def reason(path):
              # The action hides Claude's messages from the log; its execution file
              # keeps the final result, whose text is the API's error when the call
              # failed ("Credit balance is too low", "invalid x-api-key", ...).
              # One line, key-shaped strings scrubbed.
              try:
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
              except (OSError, ValueError, TypeError):
                  return ""
              for item in reversed(data if isinstance(data, list) else [data]):
                  if isinstance(item, dict) and item.get("type") == "result":
                      text = item.get("result")
                      if isinstance(text, str) and text.strip():
                          return scrub(" ".join(text.split()))[:300]
              return ""

          def load(raw):
              try:
                  value = json.loads(raw) if raw and raw.strip() else None
              except ValueError:
                  return None
              return value if isinstance(value, dict) else None

          def post(body):
              body = body if len(body) <= 60000 else body[:60000] + "\n\n(truncated at 60,000 characters)"
              subprocess.run(["gh", "pr", "comment", os.environ["PR"], "--body-file", "-"],
                             input=body, text=True, check=True)

          sub, api = load(os.environ.get("SUB_RESULT")), load(os.environ.get("API_RESULT"))
          if sub:
              result, route = sub, f"the subscription (`{os.environ['SUB_MODEL']}`)"
          elif api:
              result, route = api, f"the API key fallback (`{os.environ['API_MODEL']}`)"
          else:
              def line(name, outcome, present, secret, execution):
                  state = outcome or "skipped"
                  if present != "true":
                      return f"- {name}: {state} (no `{secret}` secret)"
                  if secret == "ANTHROPIC_API_KEY" and os.environ.get("FALLBACK_REFUSED"):
                      return f"- {name}: refused. {scrub(os.environ['FALLBACK_REFUSED'])}"
                  why = reason(execution)
                  return f"- {name}: {state}" + (f". The API said: {why}" if why else "")
              post("\n".join([
                  "## Claude Code Review", "",
                  "**The review did not run.**", "",
                  line("Subscription", os.environ.get("SUB_OUTCOME"), os.environ["HAS_OAUTH"],
                       "CLAUDE_CODE_OAUTH_TOKEN", os.environ.get("SUB_EXEC", "")),
                  line("API key fallback", os.environ.get("API_OUTCOME"), os.environ["HAS_API_KEY"],
                       "ANTHROPIC_API_KEY", os.environ.get("API_EXEC", "")),
                  "",
                  "With the subscription out of usage and no credit on the key, the review is dark "
                  "until one comes back. Re-run this job then.",
              ]))
              print("::error::The Claude review did not run; see the PR comment for which route failed.")
              sys.exit(1)

          blocking = [scrub(str(b).strip()) for b in result.get("blocking") or [] if str(b).strip()]
          text = scrub((result.get("comment_markdown") or result.get("summary") or "").strip())
          post("## Claude Code Review\n\n" + text +
               f"\n\n---\nReviewed on {route}. Verdict: `{result.get('verdict')}`; "
               f"{len(blocking)} blocking finding(s).")
          for finding in blocking:
              print(f"::error::{finding}")
          sys.exit(1 if blocking else 0)
          PYEOF
